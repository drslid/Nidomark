name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check and unit tests
        run: pnpm check
      - name: Build (without the model)
        run: pnpm build
      - name: Build for Firefox (without the model)
        run: pnpm build:firefox
      - name: Check the Firefox build with Mozilla's add-on linter
        run: pnpm dlx web-ext@10.8.0 lint --source-dir .output/firefox-mv3
